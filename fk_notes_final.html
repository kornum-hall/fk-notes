<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes — FK</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --navy: #0C1E3C;
    --navy-mid: #162D52;
    --navy-light: #1E3D6E;
    --blue: #1464A0;
    --blue-light: #E8F0F8;
    --off-white: #F4F2EE;
    --white: #FFFFFF;
    --ink: #0C1E3C;
    --ink-mid: #3D5068;
    --ink-muted: #6B7F94;
    --ink-faint: #A8B8C8;
    --border: #DDE5EE;
    --border-light: #EEF2F6;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--off-white);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: var(--navy);
    padding: 0 24px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-left { display: flex; align-items: center; gap: 12px; }

  .app-title {
    font-family: 'DM Serif Display', serif;
    font-size: 18px;
    color: var(--white);
    font-style: italic;
    letter-spacing: -0.3px;
  }

  .note-count { font-size: 11px; color: rgba(255,255,255,0.4); font-weight: 300; }

  .sync-status {
    font-size: 11px;
    color: rgba(255,255,255,0.35);
    font-weight: 300;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .sync-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,0.25);
    transition: background 0.3s;
  }

  .sync-dot.syncing { background: #D4A843; animation: blink 1s ease-in-out infinite; }
  .sync-dot.synced  { background: #8FB87A; }
  .sync-dot.error   { background: #C4703A; }

  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .layout { display: flex; flex: 1; min-height: 0; height: calc(100vh - 52px); }

  .sidebar {
    width: 200px;
    flex-shrink: 0;
    background: var(--white);
    border-right: 1px solid var(--border);
    padding: 20px 0;
    position: sticky;
    top: 52px;
    height: calc(100vh - 52px);
    overflow-y: auto;
  }

  .sidebar-label {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-faint);
    padding: 0 16px 8px;
  }

  .filter-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 8px 16px;
    background: none;
    border: none;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--ink-mid);
    font-weight: 300;
    text-align: left;
    transition: background 0.15s, color 0.15s;
  }

  .filter-btn:hover { background: var(--off-white); }
  .filter-btn.active { background: var(--blue-light); color: var(--blue); font-weight: 500; }

  .filter-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .filter-count { margin-left: auto; font-size: 11px; color: var(--ink-faint); }
  .sidebar-divider { height: 1px; background: var(--border-light); margin: 12px 16px; }

  .main {
    flex: 1;
    min-width: 0;
    overflow-y: auto;
    padding: 28px 32px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }

  .main-inner { width: 100%; max-width: 720px; }

  .compose-area {
    background: var(--white);
    border-radius: 6px;
    border: 1px solid var(--border);
    margin-bottom: 24px;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(12,30,60,0.06);
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .compose-area:focus-within {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(20,100,160,0.08);
  }

  .compose-top {
    padding: 6px 12px;
    background: var(--off-white);
    border-bottom: 1px solid var(--border-light);
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .compose-top-label {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-right: 2px;
  }

  .tag-pill {
    display: inline-flex;
    align-items: center;
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    border: 1.5px solid transparent;
    transition: all 0.15s;
    user-select: none;
  }

  .tag-pill:hover { opacity: 0.8; }
  .tag-pill.selected { border-color: currentColor; }

  .add-tag-trigger {
    display: inline-flex;
    align-items: center;
    padding: 3px 9px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 400;
    cursor: pointer;
    border: 1.5px dashed var(--ink-faint);
    color: var(--ink-faint);
    background: transparent;
    transition: all 0.15s;
    font-family: 'DM Sans', sans-serif;
  }

  .add-tag-trigger:hover { border-color: var(--ink-muted); color: var(--ink-muted); }

  .new-tag-input {
    display: none;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 3px 10px;
    font-size: 11px;
    font-family: 'DM Sans', sans-serif;
    color: var(--ink);
    background: var(--white);
    outline: none;
    width: 110px;
    transition: border-color 0.15s;
  }

  .new-tag-input:focus { border-color: var(--blue); }

  textarea.compose-input {
    width: 100%;
    min-height: 100px;
    border: none;
    outline: none;
    padding: 16px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 300;
    line-height: 1.65;
    color: var(--ink);
    background: var(--white);
    resize: none;
  }

  textarea.compose-input::placeholder { color: var(--ink-faint); }

  .compose-bottom {
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid var(--border-light);
    gap: 10px;
  }

  .claude-status {
    font-size: 12px;
    color: var(--ink-faint);
    font-weight: 300;
    font-style: italic;
    flex: 1;
  }

  .save-btn {
    background: var(--navy);
    color: var(--white);
    border: none;
    border-radius: 4px;
    padding: 8px 18px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s;
    flex-shrink: 0;
  }

  .save-btn:hover:not(:disabled) { background: var(--navy-light); }
  .save-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .notes-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .notes-title { font-size: 13px; font-weight: 500; color: var(--ink-muted); letter-spacing: 0.04em; }

  .search-input {
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    color: var(--ink);
    background: var(--white);
    outline: none;
    width: 180px;
    transition: border-color 0.15s;
  }

  .search-input:focus { border-color: var(--blue); }
  .search-input::placeholder { color: var(--ink-faint); }

  .notes-list { display: flex; flex-direction: column; gap: 10px; }

  .note-card {
    background: var(--white);
    border-radius: 6px;
    border: 1px solid var(--border);
    padding: 14px 16px;
    transition: border-color 0.15s, box-shadow 0.15s;
    position: relative;
  }

  .note-card:hover {
    border-color: var(--ink-faint);
    box-shadow: 0 2px 8px rgba(12,30,60,0.06);
  }

  .note-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }

  .note-date { font-size: 11px; color: var(--ink-faint); font-weight: 300; }

  .note-body {
    font-size: 14px;
    font-weight: 300;
    line-height: 1.65;
    color: var(--ink);
    white-space: pre-wrap;
    word-break: break-word;
  }

  .note-insight {
    margin-top: 10px;
    padding: 10px 12px;
    background: var(--blue-light);
    border-radius: 4px;
    border-left: 3px solid var(--blue);
    font-size: 13px;
    font-weight: 300;
    color: var(--ink-mid);
    line-height: 1.55;
  }

  .note-insight-label {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--blue);
    margin-bottom: 4px;
  }

  .note-actions {
    position: absolute;
    top: 12px;
    right: 12px;
    display: none;
    gap: 4px;
  }

  .note-card:hover .note-actions { display: flex; }

  .note-action-btn {
    background: var(--off-white);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 4px 8px;
    font-size: 11px;
    color: var(--ink-muted);
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    transition: all 0.15s;
  }

  .note-action-btn:hover { background: var(--border); color: var(--ink); }
  .note-action-btn.delete:hover { background: #FFF0F0; color: #C0392B; border-color: #F5C6C6; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--ink-faint); }

  .empty-state p:first-child {
    font-family: 'DM Serif Display', serif;
    font-size: 20px;
    font-style: italic;
    margin-bottom: 8px;
    color: var(--ink-muted);
  }

  .empty-state p { font-size: 14px; font-weight: 300; }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--navy);
    color: var(--white);
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 400;
    opacity: 0;
    transition: all 0.3s ease;
    z-index: 1000;
    white-space: nowrap;
  }

  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 640px) {
    .sidebar { display: none; }
    .main { padding: 16px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="app-title">Notes</div>
    <div class="note-count" id="total-count"></div>
  </div>
  <div class="sync-status">
    <div class="sync-dot" id="sync-dot"></div>
    <span id="sync-text"></span>
  </div>
</header>

<div class="layout">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-label">Projects</div>
    <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">
      <span class="filter-dot" style="background:#A8B8C8"></span>
      All notes
      <span class="filter-count" id="count-all"></span>
    </button>
    <div class="sidebar-divider"></div>
    <div id="sidebar-tag-list"></div>
  </aside>

  <div class="main">
    <div class="main-inner">

      <div class="compose-area">
        <div class="compose-top" id="compose-top">
          <span class="compose-top-label">Tags</span>
          <button class="add-tag-trigger" id="add-tag-trigger" onclick="showNewTagInput()">+ New</button>
          <input class="new-tag-input" id="new-tag-input" placeholder="Tag name…" maxlength="28">
        </div>
        <textarea class="compose-input" id="compose-input" placeholder="Write a note…" rows="4"></textarea>
        <div class="compose-bottom">
          <div class="claude-status" id="claude-status"></div>
          <button class="save-btn" id="save-btn" onclick="saveNote()">Save</button>
        </div>
      </div>

      <div class="notes-header">
        <div class="notes-title" id="filter-label">All notes</div>
        <input class="search-input" id="search-input" placeholder="Search…" oninput="renderNotes()">
      </div>

      <div class="notes-list" id="notes-list"></div>

    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // ── CONFIGURATION ──
  // These values are injected by GitHub Actions at deploy time
  const SUPABASE_URL     = 'https://njwolfjnardtrgzysutb.supabase.co';
  const SUPABASE_KEY     = 'sb_publishable_gpDXykIajxajyZZgrSZdvQ_tBmw2f3W'  ;
  const ANTHROPIC_KEY    = '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';

  // ── SUPABASE ──
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // ── STATE ──
  let notes        = [];
  let customTags   = [];
  let selectedTags = new Set();
  let activeFilter = 'all';

  const DEFAULT_TAGS = [
    { id: 'housing',      label: 'Housing',              color: '#2E7D4F', bg: '#E8F5EE' },
    { id: 'availability', label: 'Availability',         color: '#1464A0', bg: '#E8F0F8' },
    { id: 'strategic',    label: 'Strategic Positioning', color: '#7B3FA0', bg: '#F3EAF8' },
    { id: 'genai',        label: 'GenAI',                 color: '#C05A1A', bg: '#FDF0E6' },
    { id: 'other',        label: 'Other',                 color: '#5A6A7E', bg: '#EEF2F6' },
  ];

  const CUSTOM_PALETTE = [
    { color: '#1A6B6B', bg: '#E4F4F4' },
    { color: '#6B6B1A', bg: '#F4F4E4' },
    { color: '#1A3D6B', bg: '#E4EDF4' },
    { color: '#4A6B1A', bg: '#EDF4E4' },
    { color: '#6B1A5A', bg: '#F4E4F0' },
  ];

  function allTags() { return [...DEFAULT_TAGS, ...customTags]; }

  function tagById(id) {
    return allTags().find(t => t.id === id) || { label: id, color: '#5A6A7E', bg: '#EEF2F6' };
  }

  // ── SYNC STATUS ──
  function setSyncStatus(state, text) {
    const dot = document.getElementById('sync-dot');
    const txt = document.getElementById('sync-text');
    dot.className = 'sync-dot ' + (state || '');
    txt.textContent = text || '';
  }

  // ── LOAD FROM SUPABASE ──
  async function loadFromCloud() {
    setSyncStatus('syncing', 'Loading…');
    try {
      const [{ data: notesData }, { data: tagsData }] = await Promise.all([
        sb.from('notes').select('*').order('created_at', { ascending: false }),
        sb.from('custom_tags').select('*').order('created_at', { ascending: true })
      ]);
      notes      = notesData || [];
      customTags = tagsData  || [];
      setSyncStatus('synced', 'Synced');
    } catch(e) {
      setSyncStatus('error', 'Offline');
      console.error(e);
    }
    renderComposeTags();
    renderSidebar();
    renderNotes();
    updateCounts();
  }

  // ── CLAUDE INTEGRATION ──
  async function processWithClaude(text, tags) {
    const claudeStatus = document.getElementById('claude-status');
    claudeStatus.textContent = 'Claude is thinking…';

    const systemPrompt = `You are a note-processing assistant for Frederik Kornum-Hall, a Creative Strategist at Danske Bank's Corporate Brand team within GPS (Group Communications & Sustainability).

Frederik works on these projects:
- Housing: A narrative/positioning project unifying Danske Bank's housing loan offerings under one brand story. The challenge is converting 35% search share into market share through better brand positioning.
- Availability: An exploratory positioning project about making Danske Bank feel present, accessible and approachable as it becomes more digital and withdraws from physical locations.
- Strategic Positioning: General corporate brand positioning work, including the "enabling sustainable progress" narrative, Blue Book, tone of voice, and Forward '28 strategy.
- GenAI: Internal strategy work on integrating generative AI into the Corporate Brand team's workflows.
- Other: Anything else.

When given a note, respond with a JSON object only — no preamble, no markdown:
{
  "insight": "A brief, sharp observation connecting this note to broader context, patterns across projects, or strategic implications. 1-2 sentences max. If the note is purely logistical, leave this empty string.",
  "suggested_tags": ["tag_id_1", "tag_id_2"]
}

Valid tag IDs: housing, availability, strategic, genai, other, and any custom tags provided.
Current custom tags: ${JSON.stringify(customTags.map(t => t.id))}
User-selected tags: ${JSON.stringify([...tags])}

Suggest tags that genuinely apply. Include user-selected tags unless clearly wrong. Add relevant ones the user missed.`;

    try {
      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': ANTHROPIC_KEY,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-client-side-allow-cors': 'true'
        },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 300,
          system: systemPrompt,
          messages: [{ role: 'user', content: text }]
        })
      });

      const data = await response.json();
      const raw  = data.content?.[0]?.text || '{}';
      const clean = raw.replace(/```json|```/g, '').trim();
      const parsed = JSON.parse(clean);
      claudeStatus.textContent = '';
      return parsed;
    } catch(e) {
      console.error('Claude error:', e);
      claudeStatus.textContent = '';
      return { insight: '', suggested_tags: [...tags] };
    }
  }

  // ── SAVE NOTE ──
  async function saveNote() {
    const input = document.getElementById('compose-input');
    const text  = input.value.trim();
    if (!text) return;
    if (selectedTags.size === 0) { showToast('Select at least one tag'); return; }

    const btn = document.getElementById('save-btn');
    btn.disabled = true;
    setSyncStatus('syncing', 'Saving…');

    // Process with Claude
    const { insight, suggested_tags } = await processWithClaude(text, selectedTags);
    const finalTags = suggested_tags?.length ? suggested_tags : [...selectedTags];

    // Save to Supabase
    try {
      const { data, error } = await sb.from('notes').insert([{
        text,
        tags: finalTags,
        insight: insight || null
      }]).select().single();

      if (error) throw error;

      notes.unshift(data);
      input.value = '';
      selectedTags.clear();
      renderComposeTags();
      renderNotes();
      updateCounts();
      setSyncStatus('synced', 'Synced');
      showToast('Saved');
    } catch(e) {
      setSyncStatus('error', 'Save failed');
      showToast('Could not save — check connection');
      console.error(e);
    }

    btn.disabled = false;
  }

  // ── DELETE ──
  async function deleteNote(id) {
    try {
      await sb.from('notes').delete().eq('id', id);
      notes = notes.filter(n => n.id !== id);
      renderNotes();
      updateCounts();
      showToast('Deleted');
    } catch(e) {
      showToast('Could not delete');
    }
  }

  // ── COPY ──
  function copyNote(text) {
    navigator.clipboard.writeText(text).then(() => showToast('Copied'));
  }

  // ── RENDER COMPOSE TAGS ──
  function renderComposeTags() {
    const top     = document.getElementById('compose-top');
    const trigger = document.getElementById('add-tag-trigger');
    const inp     = document.getElementById('new-tag-input');
    top.querySelectorAll('.tag-pill').forEach(el => el.remove());

    allTags().forEach(tag => {
      const pill = document.createElement('span');
      pill.className = 'tag-pill' + (selectedTags.has(tag.id) ? ' selected' : '');
      pill.dataset.tag = tag.id;
      pill.textContent = tag.label;
      pill.style.color      = tag.color;
      pill.style.background = tag.bg;
      pill.onclick = () => toggleTag(tag.id);
      top.insertBefore(pill, trigger);
    });
  }

  function toggleTag(id) {
    if (selectedTags.has(id)) selectedTags.delete(id);
    else selectedTags.add(id);
    renderComposeTags();
  }

  // ── NEW TAG ──
  function showNewTagInput() {
    document.getElementById('add-tag-trigger').style.display = 'none';
    const inp = document.getElementById('new-tag-input');
    inp.style.display = 'inline-block';
    inp.focus();
  }

  async function createNewTag() {
    const inp   = document.getElementById('new-tag-input');
    const label = inp.value.trim();
    if (!label) { cancelNewTag(); return; }

    const id = label.toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'');
    if (!id || allTags().find(t => t.id === id)) { cancelNewTag(); return; }

    const palette = CUSTOM_PALETTE[customTags.length % CUSTOM_PALETTE.length];
    const newTag  = { id, label, ...palette };

    try {
      await sb.from('custom_tags').insert([newTag]);
      customTags.push(newTag);
      inp.value = '';
      cancelNewTag();
      renderComposeTags();
      renderSidebar();
      selectedTags.add(id);
      renderComposeTags();
      showToast(`Tag "${label}" created`);
    } catch(e) {
      showToast('Could not create tag');
    }
  }

  function cancelNewTag() {
    document.getElementById('new-tag-input').style.display = 'none';
    document.getElementById('add-tag-trigger').style.display = 'inline-flex';
  }

  // ── SIDEBAR ──
  function renderSidebar() {
    const list = document.getElementById('sidebar-tag-list');
    list.innerHTML = '';
    allTags().forEach(tag => {
      const btn = document.createElement('button');
      btn.className = 'filter-btn' + (activeFilter === tag.id ? ' active' : '');
      btn.dataset.filter = tag.id;
      btn.onclick = () => setFilter(tag.id);
      btn.innerHTML = `
        <span class="filter-dot" style="background:${tag.color}"></span>
        ${tag.label}
        <span class="filter-count" id="count-${tag.id}"></span>`;
      list.appendChild(btn);
    });
    updateCounts();
  }

  // ── FILTER ──
  function setFilter(filter) {
    activeFilter = filter;
    document.querySelectorAll('.filter-btn').forEach(el => {
      el.classList.toggle('active', el.dataset.filter === filter);
    });
    document.getElementById('filter-label').textContent =
      filter === 'all' ? 'All notes' : tagById(filter).label;
    renderNotes();
  }

  // ── FORMAT DATE ──
  function formatDate(iso) {
    const d    = new Date(iso);
    const now  = new Date();
    const diff = Math.floor((now - d) / 1000);
    const time = d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    if (diff < 60)     return 'Just now';
    if (diff < 3600)   return `${Math.floor(diff/60)}m ago · ${time}`;
    if (diff < 86400)  return `Today · ${time}`;
    if (diff < 172800) return `Yesterday · ${time}`;
    return d.toLocaleDateString('en-GB', {
      day: 'numeric', month: 'short',
      year: d.getFullYear() !== now.getFullYear() ? 'numeric' : undefined
    }) + ` · ${time}`;
  }

  function esc(t) { return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // ── RENDER NOTES ──
  function renderNotes() {
    const list   = document.getElementById('notes-list');
    const search = document.getElementById('search-input').value.toLowerCase();

    const filtered = notes.filter(n => {
      const noteTags    = n.tags || [];
      const matchFilter = activeFilter === 'all' || noteTags.includes(activeFilter);
      const matchSearch = !search || n.text.toLowerCase().includes(search);
      return matchFilter && matchSearch;
    });

    if (!filtered.length) {
      list.innerHTML = `
        <div class="empty-state">
          <p>Nothing here yet</p>
          <p>${activeFilter === 'all' ? 'Write your first note above' : 'No notes in this project'}</p>
        </div>`;
      return;
    }

    list.innerHTML = filtered.map(note => {
      const noteTags = note.tags || [];
      const tagPills = noteTags.map(tid => {
        const t = tagById(tid);
        return `<span class="tag-pill" style="color:${t.color};background:${t.bg};font-size:10px;padding:2px 8px;border:1.5px solid transparent;cursor:default;">${t.label}</span>`;
      }).join('');

      const insightHtml = note.insight ? `
        <div class="note-insight">
          <div class="note-insight-label">Claude</div>
          ${esc(note.insight)}
        </div>` : '';

      return `
        <div class="note-card">
          <div class="note-meta">
            ${tagPills}
            <span class="note-date">${formatDate(note.created_at)}</span>
          </div>
          <div class="note-body">${esc(note.text)}</div>
          ${insightHtml}
          <div class="note-actions">
            <button class="note-action-btn" onclick="copyNote(${JSON.stringify(note.text)})">Copy</button>
            <button class="note-action-btn delete" onclick="deleteNote('${note.id}')">Delete</button>
          </div>
        </div>`;
    }).join('');
  }

  // ── COUNTS ──
  function updateCounts() {
    const all = notes.length;
    document.getElementById('total-count').textContent = all ? `${all} note${all !== 1 ? 's' : ''}` : '';
    document.getElementById('count-all').textContent = all || '';
    allTags().forEach(tag => {
      const el = document.getElementById(`count-${tag.id}`);
      if (el) {
        const c = notes.filter(n => (n.tags || []).includes(tag.id)).length;
        el.textContent = c || '';
      }
    });
  }

  // ── TOAST ──
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }

  // ── KEYBOARD ──
  document.getElementById('compose-input').addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); saveNote(); }
  });

  document.getElementById('new-tag-input').addEventListener('keydown', e => {
    if (e.key === 'Enter')  createNewTag();
    if (e.key === 'Escape') cancelNewTag();
  });

  document.getElementById('new-tag-input').addEventListener('blur', () => {
    setTimeout(() => {
      if (document.getElementById('new-tag-input').value.trim()) createNewTag();
      else cancelNewTag();
    }, 150);
  });

  // ── INIT ──
  loadFromCloud();
</script>
</body>
</html>
