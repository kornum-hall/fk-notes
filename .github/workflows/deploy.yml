name: Deploy

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Inject secrets
        run: |
          sed -i "s|VITE_SUPABASE_URL|${{ secrets.VITE_SUPABASE_URL }}|g" fk_notes_final.html
          sed -i "s|VITE_SUPABASE_KEY|${{ secrets.VITE_SUPABASE_KEY }}|g" fk_notes_final.html
          sed -i "s|VITE_ANTHROPIC_KEY|${{ secrets.VITE_ANTHROPIC_KEY }}|g" fk_notes_final.html

      - name: Deploy to Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
