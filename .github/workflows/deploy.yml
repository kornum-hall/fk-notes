name: Deploy

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Inject secrets
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
          ANTHROPIC_KEY: ${{ secrets.VITE_ANTHROPIC_KEY }}
        run: |
          python3 -c "
          import os
          with open('fk_notes_final.html', 'r') as f:
              content = f.read()
          content = content.replace('VITE_SUPABASE_URL', os.environ['SUPABASE_URL'])
          content = content.replace('VITE_SUPABASE_KEY', os.environ['SUPABASE_KEY'])
          content = content.replace('VITE_ANTHROPIC_KEY', os.environ['ANTHROPIC_KEY'])
          with open('fk_notes_final.html', 'w') as f:
              f.write(content)
          "

      - name: Deploy to Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
